# 配置名称: Shadowrocket-Ho-New
# 配置版本: 2026.08.20
# 基准来源: Ho-New-Config-FakeIP-Template.yaml
# 规则来源: https://github.com/blackmatrix7/ios_rule_script/tree/master/rule/Shadowrocket
# 设计: 仅命中下列远程域名集时使用代理，其余流量全部直连

[General]
ipv6 = false
dns-server = h3://dns.alidns.com/dns-query, https://doh.pub/dns-query
fallback-dns-server = 119.29.29.29, 1.12.12.12
hijack-dns = *:53

[Proxy Group]
🖐️本地节点 = select,policy-regex-filter=.*
✅默认代理 = select,🖐️本地节点,PROXY,DIRECT,policy-select-name=🖐️本地节点
🌐默认直连 = select,DIRECT,PROXY,policy-select-name=DIRECT
🅰️Ai = select,✅默认代理,PROXY,DIRECT
💰Crypto = select,✅默认代理,PROXY,DIRECT
📱国际社交软件 = select,✅默认代理,PROXY,DIRECT

[Rule]
# AI
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/OpenAI/OpenAI.list,🅰️Ai
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Claude/Claude.list,🅰️Ai
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Gemini/Gemini.list,🅰️Ai
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Anthropic/Anthropic.list,🅰️Ai

# 加密货币
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Cryptocurrency/Cryptocurrency.list,💰Crypto

# 常见境外服务
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/GitHub/GitHub.list,✅默认代理
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/YouTube/YouTube.list,✅默认代理
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Google/Google.list,✅默认代理

# 国际社交软件
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Telegram/Telegram.list,📱国际社交软件
