# 配置名称: Shadowrocket-Ho-New
# 基准来源: Ho-New-Config-FakeIP-Template.yaml（规则分类、顺序与默认策略）
# GeoSite/GeoIP: MetaCubeX/meta-rules-dat 的 meta 分支文本导出，转换结果位于 shadowrocket/。
# 自定义规则: 本仓库 rule_set/*.yaml；运行 uv run shadowrocket/update.py 同步。
# 文本导出不保证包含完整 geosite.dat 的关键词和正则；限制详见 shadowrocket/README.md。
# 全局路由使用「配置」；✅默认代理选 PROXY 时跟随主界面节点。
# 配套去广告模块（需在 Shadowrocket「配置 → 模块」单独安装）:
# https://ghfast.top/https://raw.githubusercontent.com/GMOogway/shadowrocket-rules/master/sr_reject_list.module

[General]
ipv6 = false
dns-server = h3://dns.alidns.com/dns-query, https://doh.pub/dns-query
fallback-dns-server = 119.29.29.29, 1.12.12.12
hijack-dns = *:53
# 允许 QUIC 传输（取值：all / all-proxy / always-allow；always-allow 表示不屏蔽）
block-quic = always-allow
# 节点不支持 UDP 转发时的回退行为：REJECT 拒绝（促使回落 TCP 走代理）；DIRECT 直连转发（会泄漏真实 IP）
udp-policy-not-supported-behaviour = REJECT

[Proxy Group]
# PROXY 是主界面当前节点；手动改选其他子策略后，该组不再跟随。
✅默认代理 = select,PROXY,DIRECT,policy-select-name=PROXY
🍎Ai = select,✅默认代理,PROXY,DIRECT,policy-select-name=✅默认代理
🅰️Ai = select,✅默认代理,PROXY,DIRECT,policy-select-name=✅默认代理
💰Crypto = select,✅默认代理,PROXY,DIRECT,policy-select-name=✅默认代理
📱国际社交软件 = select,✅默认代理,PROXY,DIRECT,policy-select-name=✅默认代理
💻极客论坛 = select,✅默认代理,PROXY,DIRECT,policy-select-name=✅默认代理
🧱GFW = select,✅默认代理,PROXY,DIRECT,policy-select-name=✅默认代理
🎮Steam = select,DIRECT,✅默认代理,PROXY,policy-select-name=DIRECT
Ⓜ️微软服务 = select,DIRECT,✅默认代理,PROXY,policy-select-name=DIRECT
✈️Speedtest = select,DIRECT,✅默认代理,PROXY,policy-select-name=DIRECT
🅿️IP-Check = select,✅默认代理,PROXY,DIRECT,policy-select-name=✅默认代理
🐟漏网之鱼 = select,✅默认代理,PROXY,DIRECT,policy-select-name=✅默认代理

